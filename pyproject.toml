[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "excel-csv-automation"
version = "0.1.0.dev0"
description = "Local, auditable Excel and CSV branch report consolidation"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "streamlit>=1.40,<2",
    "pandas>=2.2,<4",
    "openpyxl>=3.1,<4",
]

[project.scripts]
excel-csv-automation = "excel_csv_automation.__main__:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/excel_csv_automation"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
