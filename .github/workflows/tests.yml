name: Project checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency manager
        run: python -m pip install uv==0.13.8
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Check formatting
        run: uv run --frozen ruff format --check .
      - name: Verify installed runtime dependencies
        run: uv run --frozen excel-csv-automation --check
      - name: Verify wheel packaging
        run: uv build --wheel
      - name: Render the application shell
        run: >-
          uv run --frozen python -c
          "from streamlit.testing.v1 import AppTest;
          app = AppTest.from_file('src/excel_csv_automation/app.py').run();
          assert not app.exception, app.exception"
